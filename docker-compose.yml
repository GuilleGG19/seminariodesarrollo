# =====================================================================
# SCCVI - Entorno de base de datos con Docker
# Servicios: PostgreSQL (motor) + pgAdmin (administrador web)
# Todas las credenciales se leen del archivo .env (no se escriben aqui)
# =====================================================================

services:

  postgres:
    image: postgres:16
    container_name: sccvi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Datos persistentes: no se pierden al apagar o recrear el contenedor
      - postgres_data:/var/lib/postgresql/data
      # Scripts .sql que se ejecutan SOLO la primera vez que se crea la base
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sccvi_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sccvi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sccvi_net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  sccvi_net:
    driver: bridge
